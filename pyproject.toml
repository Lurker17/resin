[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "resin"
version = "0.1.0"
description = "A small Rust substrate for model-specific inference engines"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "crates/resin-recipe/licenses/*.txt"]
authors = [{ name = "Eric Zhang <ekzhang1@gmail.com>" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["blake3>=1.0,<2", "numpy>=1.26,<3", "torch>=2.13.0"]

[project.optional-dependencies]
cuda = ["flashinfer-python>=0.6.15.post1; sys_platform == 'linux'"]

[dependency-groups]
deployment = [
  "modal>=1.5.3",
  "resin-models-cuda",
  "transformers>=5.14.1",
]
dev = [
  "hypothesis>=6.140,<7",
  "tml-renderers==0.2.0",
  "resin-models-torch",
  "resin-models-cuda",
  "maturin>=1.9,<2",
  "modal>=1.5.3",
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
  "huggingface-hub>=0.35",
  "safetensors>=0.5",
  "renderers==0.1.9",
  "tokenizers>=0.22.2",
  "transformers>=5.14.1",
  "ty>=0.0.90",
  "deepseek-recipe==0.2.0",
  "openai-harmony==0.0.8",
  "matplotlib>=3.10,<4",
]

[tool.maturin]
manifest-path = "crates/resin-py/Cargo.toml"
module-name = "resin._resin"
python-source = "."
python-packages = ["resin"]
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID252"]

[tool.ruff.lint.per-file-ignores]
"resin/_resin.pyi" = ["I001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["resin", "resin_models_cuda", "resin_models_torch"]

[tool.pytest.ini_options]
pythonpath = [".", "models/cuda", "models/torch"]
testpaths = ["tests", "models/cuda/tests", "models/torch/tests"]

[tool.uv]
default-groups = ["dev"]
# Workspace-only compatibility overrides for the CUDA model kernel stack. These
# do not become dependencies of the published core Resin package.
override-dependencies = [
  "apache-tvm-ffi==0.1.12; sys_platform == 'linux'",
  "nvidia-cutlass-dsl==4.6.2; sys_platform == 'linux'",
  "nvidia-cutlass-dsl-libs-base==4.6.2; sys_platform == 'linux'",
]

[tool.uv.sources]
resin-models-cuda = { workspace = true }
resin-models-torch = { workspace = true }

[tool.uv.workspace]
members = ["models/*"]

[tool.ty.rules]
# Development doesn't have all GPU-only packages available.
unresolved-import = "ignore"

# nn.Module declares forward as a writable Callable; model methods specialize it.
invalid-mutable-override = "ignore"

[tool.ty.environment]
extra-paths = [".type-libs/sources"]
