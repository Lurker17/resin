[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "resin"
version = "0.1.0"
description = "A small Rust substrate for model-specific inference engines"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Resin contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["blake3>=1.0,<2"]

[project.optional-dependencies]
torch = [
  "torch>=2.7",
  "numpy>=1.26",
  "huggingface-hub>=0.35",
  "safetensors>=0.5",
]
demo = [
    "tokenizers>=0.21",
]
dev = [
    "maturin>=1.9,<2",
    "modal>=1.5.3",
    "pytest>=8,<9",
    "ruff>=0.16,<0.17",
]

[tool.maturin]
module-name = "resin._resin"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
