[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "resin"
version = "0.1.0"
description = "A small Rust substrate for model-specific inference engines"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Eric Zhang <ekzhang1@gmail.com>" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["blake3>=1.0,<2"]

[project.optional-dependencies]
torch = [
  "torch>=2.7",
  "numpy>=1.26",
  "huggingface-hub>=0.35",
  "safetensors>=0.5",
]
cuda = [
  "torch==2.13.0",
  "numpy==2.5.1; python_version >= '3.12'",
  "numpy==2.4.6; python_version < '3.12'",
  "huggingface-hub==1.27.0",
  "hf-xet==1.6.0",
  "safetensors==0.8.0",
  "kernels==0.15.2",
  "triton==3.7.1",
  "tilelang==0.1.11; sys_platform == 'linux'",
  "flashinfer-python==0.6.15.post1",
  "flash-attn-4==4.0.0b26",
  "nvidia-cutlass-dsl==4.6.2",
  "nvidia-cutlass-dsl-libs-base==4.6.2",
  "apache-tvm-ffi==0.1.11",
  "cuda-tile==1.5.0",
  "quack-kernels==0.6.4",
  "sgl-deep-gemm==0.1.5.post2; sys_platform == 'linux'",
]
demo = [
  "torch==2.13.0",
  "numpy==2.5.1; python_version >= '3.12'",
  "numpy==2.4.6; python_version < '3.12'",
  "huggingface-hub==1.27.0",
  "safetensors==0.8.0",
  "renderers==0.1.9",
  "tokenizers==0.22.2",
  "transformers==5.14.1",
]
dev = ["maturin>=1.9,<2", "modal>=1.5.3", "pytest>=8,<9", "ruff>=0.16,<0.17"]

[tool.maturin]
module-name = "resin._resin"
python-source = "src"
python-packages = ["resin"]
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
override-dependencies = [
  "apache-tvm-ffi==0.1.11",
  "nvidia-cutlass-dsl==4.6.2",
  "nvidia-cutlass-dsl-libs-base==4.6.2",
]
