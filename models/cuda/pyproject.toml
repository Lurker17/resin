[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[project]
name = "resin-models-cuda"
version = "0.1.0"
description = "Optimized LLM implementations for Resin, in CUDA"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "resin[cuda]==0.1.0",
  "resin-models-torch==0.1.0",
  "huggingface-hub>=0.35",
  "pillow>=10",
  "safetensors>=0.5",
  "transformers>=5.14.1",
  # The optimized kernels are tested as one compatibility stack.
  "torch==2.13.0",
  "torchvision==0.28.0",
  "triton==3.7.1; sys_platform == 'linux'",
  "tilelang==0.1.14; sys_platform == 'linux'",
  "flashinfer-python==0.6.15.post1; sys_platform == 'linux'",
  "flash-attn-4==4.0.0b26; sys_platform == 'linux'",
  "flash-linear-attention==0.5.2; sys_platform == 'linux'",
  "nvidia-cutlass-dsl==4.6.2; sys_platform == 'linux'",
  "nvidia-cutlass-dsl-libs-base==4.6.2; sys_platform == 'linux'",
  "apache-tvm-ffi==0.1.12; sys_platform == 'linux'",
  "cuda-tile==1.5.0; sys_platform == 'linux'",
  "quack-kernels==0.6.4; sys_platform == 'linux'",
  "sgl-deep-gemm==0.1.5.post2; sys_platform == 'linux'",
]

[tool.uv.sources]
resin = { workspace = true }
resin-models-torch = { workspace = true }

[tool.uv.build-backend]
module-root = ""
