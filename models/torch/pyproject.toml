[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[project]
name = "resin-models-torch"
version = "0.1.0"
description = "Reference LLM implementations for Resin, in PyTorch"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["resin[torch]==0.1.0"]

[tool.uv.sources]
resin = { workspace = true }

[tool.uv.build-backend]
module-root = ""
