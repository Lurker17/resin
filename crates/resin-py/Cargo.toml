[package]
name = "resin-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Python bindings for the Resin inference engine"

[lib]
name = "_resin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311", "experimental-inspect"] }
resin-core = { path = "../resin-core" }
