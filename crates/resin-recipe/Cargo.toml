[package]
name = "resin-recipe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Model conversation formats and incremental response parsing for Resin"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
